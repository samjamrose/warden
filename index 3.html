<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wardenfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600;700;900&display=swap">
<style>
/* Layout: full-bleed 3D canvas, HUD pinned to the edges, modal screens centred over a dimmed scene. */
:root {
  --ink: #0b1513; --panel: #12211d; --panel2: #1a2e28; --line: #35544a; --gold: #e6bd62; --gold-dim: #a88a47;
  --text: #efe8d3; --mute: #9db2a7; --red: #d9544f; --teal: #59c9b0; --violet: #a98bff; --blue: #6fb8ff;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif; --body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 500 16px/1.35 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); user-select: none; -webkit-user-select: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui button, #ui input, .modal { pointer-events: auto; }
[hidden] { display: none !important; }
.ico { flex: none; }
kbd { font: 700 .8em var(--body); padding: .05em .45em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; background: var(--panel2); color: var(--gold); }
b { font-weight: 700; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .55rem; min-height: 44px; padding: .55rem 1.1rem; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 3px; font: 700 1rem var(--body); letter-spacing: .05em; cursor: pointer; transition: border-color .15s, background .15s, transform .1s; }
.btn:hover:not(:disabled) { border-color: var(--gold); background: #213a33; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:focus-visible, .choice:focus-visible, .aslot:focus-visible, .iconbtn:focus-visible, .loadrow:focus-visible, .switch:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: linear-gradient(#efce7e, #c99b3d); color: #231a07; border-color: #f6e3a5; text-shadow: 0 1px 0 rgba(255,255,255,.3); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(#f6daa0, #d6a847); }
.btn.big { min-height: 54px; font-size: 1.12rem; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--mute); }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: transparent; border-color: var(--line); }
.btn.warn { border-color: var(--red); color: #ffb3ad; }
.btn.buy { min-width: 84px; color: var(--gold); border-color: var(--gold-dim); }
.btn.buy:disabled { color: var(--mute); border-color: var(--line); }
.btn.opt { flex-direction: column; align-items: flex-start; gap: .1rem; text-align: left; letter-spacing: .02em; width: 100%; padding: .7rem 1rem; }
.btn.opt small { font-weight: 500; color: var(--mute); font-size: .92rem; letter-spacing: 0; }
.btn.opt:has(.oi) { flex-direction: row; align-items: center; gap: .9rem; }
.oi { color: var(--gold); display: flex; } .ot { flex: 1; display: flex; flex-direction: column; } .oc { display: inline-flex; align-items: center; gap: .3rem; color: var(--gold); font-weight: 700; }
.tag { display: inline-block; padding: .25rem .65rem; border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 2px; font-weight: 700; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.tag.dim { border-color: var(--line); color: var(--mute); }

/* ---------- modal + panels ---------- */
.modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 11, 9, .6); animation: fadein .25s ease; }
.screen-menu { justify-content: flex-start; background: linear-gradient(90deg, rgba(6,12,10,.9) 0%, rgba(6,12,10,.62) 42%, rgba(6,12,10,0) 78%); padding-left: max(16px, 6vw); }
.screen-levelUp { background: rgba(5, 11, 9, .72); }
.panel { width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; min-height: 0; background: rgba(13, 25, 22, .94); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 0 0 3px rgba(13,25,22,.9), 0 0 0 4px var(--gold-dim), 0 20px 60px rgba(0,0,0,.55); }
.panel.narrow { width: min(640px, 100%); }
.panel.small { width: min(500px, 100%); padding: 1.6rem 1.5rem; gap: .9rem; overflow-y: auto; }
.panel.center { text-align: center; align-items: stretch; }
.sh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
.sh h2 { margin: 0; font: 700 1.5rem var(--display); letter-spacing: .1em; color: var(--gold); text-align: center; }
.sh .btn { justify-self: start; }
.sh .btn svg { transform: none; }
.aurel { justify-self: end; display: inline-flex; align-items: center; gap: .4rem; color: var(--gold); font-size: 1.15rem; }
.aurel.inline { justify-self: center; }
.aurel small { color: var(--mute); font-size: .85rem; }
.scroll { overflow-y: auto; padding: 1rem 1.2rem 1.3rem; display: flex; flex-direction: column; gap: 1.1rem; min-height: 0; overscroll-behavior: contain; }
h2, h3, h4 { margin: 0; }
.panel.small h2 { font: 700 1.7rem var(--display); letter-spacing: .08em; color: var(--gold); }
.big-title { font-size: 2rem !important; }
.sec { font: 700 .95rem var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); margin-bottom: .6rem; padding-bottom: .4rem; border-bottom: 1px solid var(--line); }
.eyebrow { margin: 0; color: var(--teal); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: .82rem; }
.note { margin: 0; color: var(--mute); }
.story { margin: 0; color: var(--mute); font-size: 1.05rem; }
.result { margin: 0; color: var(--text); font-size: 1.1rem; padding: .7rem .9rem; border-left: 3px solid var(--gold); background: var(--panel2); text-align: left; }
.stack { display: flex; flex-direction: column; gap: .6rem; }

/* ---------- menu ---------- */
.menu-main { display: flex; flex-direction: column; gap: 1rem; width: min(360px, 100%); }
.title { margin: 0; font: 900 clamp(3rem, 11vw, 5.6rem)/0.95 var(--display); letter-spacing: .04em; color: var(--text); text-shadow: 0 4px 24px rgba(0,0,0,.5); }
.title span { color: var(--gold); }
.menu-nav { display: grid; gap: .55rem; margin-top: .6rem; }
.menu-nav .btn { justify-content: flex-start; padding-left: 1.2rem; }
.menu-nav .btn.big { padding-left: 1.2rem; }
.menu-foot { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin: .5rem 0 0; color: var(--mute); font-size: .95rem; }
.menu-foot span { display: inline-flex; align-items: center; gap: .3rem; }

/* ---------- start run ---------- */
.hero-region h3 { font: 700 1.9rem var(--display); color: var(--gold); letter-spacing: .06em; margin: .2rem 0; }
.hero-region p { margin: 0; color: var(--mute); }
.hero-region { padding: 1rem 1.1rem; border: 1px solid var(--line); background: linear-gradient(120deg, rgba(76,128,66,.28), rgba(26,46,40,.4)); border-radius: 3px; }
.loadout { display: grid; gap: .5rem; }
.loadrow { display: grid; grid-template-columns: 28px 1fr auto auto; align-items: center; gap: .8rem; text-align: left; padding: .7rem 1rem; min-height: 48px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; font: 500 1rem var(--body); }
.loadrow:hover { border-color: var(--gold); }
.loadrow .k { color: var(--mute); } .loadrow b { color: var(--text); } .loadrow em { color: var(--gold); font-style: normal; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
.loadrow svg { color: var(--gold); }
.tips { padding: .8rem 1rem; border: 1px dashed var(--line); border-radius: 3px; color: var(--mute); }
.tips p { margin: .3rem 0 0; }

/* ---------- cards + stats ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: .7rem; }
.card { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: .9rem; align-items: center; padding: .85rem; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; }
.card.sel { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(230,189,98,.35); }
.card.locked { opacity: .65; }
.lockbar { display: flex; align-items: center; justify-content: center; gap: .45rem; margin-top: .55rem; padding: .35rem; border: 1px dashed var(--line); border-radius: 3px; color: var(--mute); font-weight: 700; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; background: rgba(0,0,0,.18); }
.card .ci { width: 52px; height: 52px; display: grid; place-items: center; color: var(--c, var(--gold)); background: rgba(0,0,0,.28); border: 1px solid var(--c, var(--line)); border-radius: 3px; }
.card h4 { font: 700 1.05rem var(--display); letter-spacing: .05em; margin-bottom: .15rem; }
.card p { margin: 0; color: var(--mute); font-size: .98rem; }
.card small { color: var(--mute); display: block; margin-top: .3rem; font-size: .88rem; }
.cb { min-width: 0; }
.meters { display: grid; gap: 3px; margin-top: .5rem; }
.meter { display: grid; grid-template-columns: 56px 1fr; gap: .5rem; align-items: center; font-size: .82rem; color: var(--mute); }
.meter i { display: block; height: 5px; background: rgba(0,0,0,.4); border-radius: 2px; overflow: hidden; } .meter u { display: block; height: 100%; background: var(--gold); }
.pips { display: flex; gap: 4px; margin-top: .5rem; } .pips i { width: 16px; height: 6px; background: rgba(0,0,0,.4); border: 1px solid var(--line); } .pips i.on { background: var(--gold); border-color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .5rem; }
.stats.three { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
.stat { padding: .6rem .8rem; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; text-align: left; }
.stat span { display: block; color: var(--mute); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
.stat b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.center .stat { text-align: center; }

/* ---------- settings ---------- */
.row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.row.danger { border-bottom: 0; }
.row input[type=range] { width: min(240px, 50%); accent-color: var(--gold); height: 28px; }
.switch { width: 54px; height: 30px; padding: 3px; background: rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 15px; cursor: pointer; }
.switch i { display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--mute); transition: transform .15s, background .15s; }
.switch.on { border-color: var(--gold); } .switch.on i { transform: translateX(24px); background: var(--gold); }

/* ---------- level up ---------- */
.levelup { width: min(980px, 100%); max-height: 100%; overflow-y: auto; text-align: center; display: flex; flex-direction: column; gap: .8rem; align-items: center; padding: 8px; }
.levelup h2 { font: 700 clamp(1.5rem, 4vw, 2.3rem) var(--display); letter-spacing: .1em; color: var(--gold); }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9rem; width: 100%; margin-top: .4rem; }
.choice { position: relative; display: flex; flex-direction: column; align-items: center; gap: .45rem; padding: 1.5rem 1rem 1.2rem; min-height: 230px; background: linear-gradient(#1b312a, #12211d); color: var(--text); border: 1px solid var(--rc, var(--line)); border-radius: 4px; cursor: pointer; font: 500 1rem var(--body); transition: transform .15s, box-shadow .15s; animation: rise .35s ease backwards; }
.choice:nth-child(2) { animation-delay: .06s; } .choice:nth-child(3) { animation-delay: .12s; }
.choice:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 0 1px var(--rc); }
.choice .cico { width: 62px; height: 62px; display: grid; place-items: center; color: var(--rc); border: 1px solid var(--rc); border-radius: 50%; background: rgba(0,0,0,.3); }
.choice b { font: 700 1.15rem var(--display); letter-spacing: .05em; }
.choice p { margin: 0; color: var(--mute); font-size: 1.02rem; }
.choice .rar { color: var(--rc); font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.choice .key { position: absolute; top: 8px; left: 10px; color: var(--mute); font-size: .85rem; border: 1px solid var(--line); border-radius: 3px; padding: 0 .4rem; }
.r-common { --rc: #b8cfc6; } .r-rare { --rc: var(--blue); } .r-epic { --rc: var(--violet); }

/* ---------- summary ---------- */
.ledger { display: grid; gap: .3rem; padding: .7rem .9rem; border: 1px solid var(--line); background: var(--panel2); text-align: left; }
.ledger div { display: flex; justify-content: space-between; gap: 1rem; color: var(--mute); } .ledger b { color: var(--text); font-variant-numeric: tabular-nums; }
.ledger .total { border-top: 1px solid var(--line); padding-top: .4rem; margin-top: .2rem; color: var(--gold); font-weight: 700; font-size: 1.1rem; } .ledger .total b { color: var(--gold); display: inline-flex; align-items: center; gap: .3rem; }
.unlock { margin: 0; color: var(--teal); display: flex; gap: .4rem; justify-content: center; align-items: center; font-weight: 700; }
.win .big-title { color: #ffd77a; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; }
#hud > * { position: absolute; }
.hud-tl { top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; align-items: center; gap: 10px; }
.lvl { width: 48px; height: 48px; display: grid; place-content: center; text-align: center; background: radial-gradient(#243e35, #0f1b18); border: 2px solid var(--gold); border-radius: 50%; line-height: 1; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.lvl span { font-size: .6rem; letter-spacing: .15em; color: var(--mute); } .lvl b { font: 700 1.3rem var(--display); color: var(--gold); }
.bars { width: min(250px, 44vw); display: grid; gap: 5px; }
.bar { position: relative; background: rgba(5,10,9,.7); border: 1px solid rgba(0,0,0,.6); outline: 1px solid rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; transition: width .12s linear; }
.bar.hp { height: 20px; } .bar.hp i { background: linear-gradient(#e86a62, #b8403b); }
.bar.hp b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .82rem; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.bar.xp { height: 8px; } .bar.xp i { background: linear-gradient(#7af0d4, #3aa890); width: 0; }
.hud-tr { top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 10px; align-items: center; }
.gold { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .75rem; background: rgba(5,10,9,.7); border: 1px solid var(--gold-dim); border-radius: 3px; color: var(--gold); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; background: rgba(5,10,9,.7); color: var(--text); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
.iconbtn:hover { border-color: var(--gold); }
.hud-top { top: calc(72px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.8); width: max-content; max-width: calc(100% - 32px); }
#h-room { font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
#h-obj { font: 700 1.1rem var(--display); letter-spacing: .06em; }
#h-boss { top: calc(118px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); }
.bn { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font: 700 1rem var(--display); letter-spacing: .08em; text-shadow: 0 1px 3px #000; }
.bn span { font: 600 .8rem var(--body); color: var(--teal); letter-spacing: .14em; text-transform: uppercase; }
.bbar { height: 14px; margin-top: 4px; background: rgba(5,10,9,.75); border: 1px solid var(--gold-dim); border-radius: 2px; overflow: hidden; } .bbar i { display: block; height: 100%; width: 100%; background: linear-gradient(#ff7a5e, #b5392c); transition: width .15s linear; }
.hud-bl { left: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: .5rem; padding: .45rem .7rem; background: rgba(5,10,9,.65); border: 1px solid var(--line); border-radius: 3px; color: var(--text); font-weight: 700; letter-spacing: .04em; }
.hud-bl svg { color: var(--gold); }
.hud-bc { left: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
.aslot { position: relative; width: 58px; height: 58px; display: grid; place-items: center; padding: 0; background: rgba(8,16,14,.82); color: var(--c, var(--text)); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; overflow: hidden; }
.aslot.empty { border-style: dashed; opacity: .55; cursor: default; }
.aslot.dash { margin-top: 10px; color: var(--text); }
.aslot .cd { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--cd, 0) * 100%); background: rgba(0,0,0,.66); pointer-events: none; }
.aslot kbd { position: absolute; right: 3px; bottom: 2px; pointer-events: none; padding: 0 .3rem; font-size: .62rem; background: rgba(0,0,0,.5); border: 0; color: var(--mute); }
.aslot.ready { border-color: var(--c, var(--gold)); box-shadow: 0 0 12px -2px var(--c, var(--gold)); animation: ready 1.6s ease-in-out infinite; } .aslot.dash.ready { border-color: var(--text); box-shadow: none; }
.aslot.active { background: rgba(60,50,20,.9); }
.wlabel { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .7rem; background: rgba(8,16,14,.82); border: 1px solid var(--c); color: var(--c); border-radius: 3px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; text-shadow: 0 1px 2px #000; will-change: transform; }
#labels, #floats { position: absolute; inset: 0; overflow: hidden; }
.float { position: absolute; transform: translate(-50%, -50%); font: 700 1.1rem var(--body); color: #fff; text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.6); animation: floatup .8s ease-out forwards; white-space: nowrap; }
.float.crit { color: var(--gold); font-size: 1.5rem; } .float.dot { color: #ffa44a; font-size: .95rem; } .float.hurt { color: #ff6a62; font-size: 1.5rem; }
.float.heal { color: #7af0a0; } .float.dodge { color: var(--blue); font-style: italic; }
.banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; display: grid; gap: .2rem; pointer-events: none; opacity: 0; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
.banner b { font: 900 clamp(1.8rem, 6vw, 3.2rem) var(--display); letter-spacing: .12em; text-transform: uppercase; }
.banner span { font-size: 1.15rem; letter-spacing: .12em; color: var(--text); text-transform: uppercase; }
.banner.show { animation: banner 2.4s ease forwards; }
.toast { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); padding: .4rem 1.1rem; background: rgba(8,16,14,.8); border: 1px solid var(--gold-dim); color: var(--gold); font: 700 1.1rem var(--display); letter-spacing: .1em; opacity: 0; pointer-events: none; white-space: nowrap; }
.toast.boss { color: #7af0d4; border-color: #3aa890; } .toast.warn { color: #ffb3ad; border-color: var(--red); } .toast.good { color: #7af0a0; }
.toast.show { animation: toast 1.8s ease forwards; }
#joy { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
#joy::before { content: ''; position: absolute; width: 112px; height: 112px; left: -56px; top: -56px; border-radius: 50%; border: 2px solid rgba(239,232,211,.35); background: rgba(239,232,211,.06); }
#joy i { position: absolute; width: 46px; height: 46px; left: -23px; top: -23px; border-radius: 50%; background: rgba(239,232,211,.45); border: 2px solid rgba(239,232,211,.7); }
#fade { position: absolute; inset: 0; background: #050a09; opacity: 0; pointer-events: none; }
#boot { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: var(--ink); padding: 24px; z-index: 5; }
#boot h1 { font: 900 2.4rem var(--display); color: var(--gold); letter-spacing: .1em; margin: 0 0 .5rem; }
#boot p { margin: 0; color: var(--mute); }

@keyframes ready { 50% { box-shadow: 0 0 18px 1px var(--c, var(--gold)); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

{
/* Wardenfall — core namespace, event bus and utilities */

RL.Events = class {
  constructor() { this.h = {}; }
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); return () => this.off(e, f); }
  off(e, f) { const a = this.h[e]; if (a) { const i = a.indexOf(f); if (i >= 0) a.splice(i, 1); } }

    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    chance: (p) => Math.random() < p,
    pick: (arr, r) => arr[Math.floor((r || Math.random)() * arr.length)],
    dist: (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz),
    angleDiff(a, b) {

    weighted(items, wfn, r) {

  }];

{
/* Models — procedural placeholder models built from primitives (no external assets).
   Every model faces +Z. build(kind) returns a model handle with update()/setEmissive(). */
RL.Models = (function () {
  const T = THREE;
  const geos = {};
  function G(n) {
    if (geos[n]) return geos[n];
    const m = {
      box: () => new T.BoxGeometry(1, 1, 1), cyl: () => new T.CylinderGeometry(0.5, 0.5, 1, 8),
      cone: () => new T.ConeGeometry(0.5, 1, 7), sph: () => new T.SphereGeometry(0.5, 10, 8),
      ico: () => new T.IcosahedronGeometry(0.5, 0), oct: () => new T.OctahedronGeometry(0.5, 0),
      taper: () => new T.CylinderGeometry(0.28, 0.5, 1, 7),
    };
    return (geos[n] = m[n]());
  }

  /* Builder: collects materials so the whole model can flash / tint. */
  function Builder() {
    this.group = new T.Group(); this.root = new T.Group(); this.group.add(this.root);
    this.mats = []; this.glow = [];
  }
  Builder.prototype.part = function (parent, g, color, sx, sy, sz, x, y, z, o) {
    o = o || {};
    const mat = new T.MeshStandardMaterial({ color, flatShading: true, roughness: o.rough === undefined ? 0.85 : o.rough, metalness: o.metal || 0 });
    if (o.glow) { mat.emissive = new T.Color(o.glow); mat.emissiveIntensity = o.gi || 1; this.glow.push(mat); } else this.mats.push(mat);
    const m = new T.Mesh(G(g), mat);
    m.scale.set(sx, sy, sz); m.position.set(x, y, z);
    m.castShadow = !o.noShadow;
    if (o.rx) m.rotation.x = o.rx; if (o.rz) m.rotation.z = o.rz; if (o.ry) m.rotation.y = o.ry;
    (parent || this.root).add(m);
    return m;
  };
  Builder.prototype.pivot = function (parent, x, y, z) {
    const p = new T.Group(); p.position.set(x, y, z); (parent || this.root).add(p); return p;
  };
  Builder.prototype.finish = function (extra) {
    const self = this;
    const model = {
      group: this.group, root: this.root, mats: this.mats, glow: this.glow, legs: this.legs || [], arm: this.arm || null, extra: extra || null,
      t: Math.random() * 6, last: -1, atk: 0,
      /* set a uniform emissive tint (hit flash / status colour) on non-glowing materials */
      setEmissive(r, g, b) {
        const key = r + g * 7 + b * 13; if (key === this.last) return; this.last = key;
        for (const m of this.mats) m.emissive.setRGB(r, g, b);
      },
      update(dt, speed01, attackT) {
        this.t += dt * (3 + speed01 * 9);
        const s = Math.sin(this.t);
        this.root.position.y = Math.abs(s) * 0.09 * speed01;
        for (let i = 0; i < this.legs.length; i++) this.legs[i].rotation.x = s * 0.8 * speed01 * (i % 2 ? -1 : 1);
        if (this.arm) this.arm.rotation.x = attackT > 0 ? -1.5 + (1 - attackT) * 2.6 : -0.25 + s * 0.25 * speed01;
        if (this.extra) this.extra(this, dt, speed01, attackT);
      },
    };
    return model;
  };

    b.part(null, 'box', 0x7a3b2e, 0.7, 1.1, 0.08, 0, 1.2, -0.38, { rx: 0.12 }); // cape
    b.part(null, 'box', 0x2a2f38, 0.55, 0.18, 0.4, 0, 0.7, 0);              // belt

{
/* PlayerStats — base stats plus named modifier sources (permanent upgrades, armor, run upgrades).
   value = (base + sum(add)) * (1 + sum(pct)). Read results from stats.v */
RL.PlayerStats = class {

  setSource(name, mods) { this.sources[name] = mods || []; this.recompute(); }
  recompute() {
    const add = {}, pct = {};

      for (const m of s) {
        if (m.add) add[m.stat] = (add[m.stat] || 0) + m.add;
        if (m.pct) pct[m.stat] = (pct[m.stat] || 0) + m.pct;

    for (const k of Object.keys(this.base)) {
      this.v[k] = (this.base[k] + (add[k] || 0)) * (1 + (pct[k] || 0));
    }

    this.v.dodge = Math.min(0.6, this.v.dodge);

RL.Status = {

  resist(e, type) {

    if (def.elite) return type === 'stun' || type === 'freeze' ? 0.4 : 0.8;

  apply(e, s) {

      if (s.type === 'burn') s = Object.assign({}, s, { dps: (s.dps || 0) * 1.3, duration: (s.duration || 1) * 1.3 });

    const dur = (s.duration || 1) * r;

/* ExperienceSystem + LevelSystem — XP gain with multipliers, and the level curve / pending queue.

    const st = c.kind === 'upgrade' ? this.stacks(c.id) : 0;

        <div class="meters">${H.meter('Damage', w.damage * w.attackSpeed, 38)}${H.meter('Speed', w.attackSpeed, 2)}${H.meter('Reach', w.range, 18)}</div><small>${w.damage} damage · ${w.attackSpeed} attacks/s</small>
        ${!own && w.craft ? (w.requires && !g.save.has('weapons', w.requires) ? `<div class="lockbar">${I('lock', 15)}<span>Locked</span></div>` : `<div class="recipe">${recipeChips(g, w)}</div>`) : ''}</div><div class="ca">${act}</div></div>`;
    };
    const groups = RL.Data.classOrder.map((cid) => {
      const c = RL.Data.classes[cid], list = Object.values(RL.Data.weapons).filter((w) => w.class === cid);
      return `<div class="class-head"><h3 class="sec">${c.name}<span class="tag cls">${classTraits(c)}</span></h3><p>${c.blurb}</p></div><div class="cards">${list.map(card).join('')}</div>`;
    }).join('');
    return `<div class="panel">${H.head(g, 'Weapons')}<div class="scroll"><p class="note">Craft weapons here. Each cleared room has a ${Math.round(RL.Data.materialChance * 100)}% chance to drop a material; a class's first weapon takes four, the rest five, and the second unlocks after the first.</p>${matBar(g)}${groups}</div></div>`;
  };

  /* ---------- Forge (crafting) ---------- */
  S.forge = (g) => {
    const d = g.save.data, mats = Object.values(RL.Data.materials).map((m) => `<span class="matchip" style="--c:#${m.color.toString(16).padStart(6, '0')}"><i></i>${m.name} <b>${g.progression.materialCount(m.id)}</b></span>`).join('');
    const item = (kind, it) => {
      const own = g.save.has(kind, it.id), can = g.progression.canCraft(kind, it.id), slot = kind === 'weapons' ? 'weapon' : 'armor', sel = d.selected[slot] === it.id;
      const locked = it.requires && !g.save.has(kind, it.requires), need = locked ? RL.Data[kind][it.requires].name : '';
      const act = sel ? '<span class="tag">Equipped</span>' : own ? `<button class="btn" data-act="select" data-slot="${slot}" data-id="${it.id}">Equip</button>` : locked ? '' : `<button class="btn buy" data-act="craft" data-kind="${kind}" data-id="${it.id}" ${can ? '' : 'disabled'}>${I('hammer', 15)}<span>Craft</span></button>`;
      const cls = it.class ? `<span class="tag cls">${RL.Data.classes[it.class].name}</span>` : '';
      return `<div class="card ${sel ? 'sel' : ''}"><div class="ci" style="--c:#${it.color.toString(16).padStart(6, '0')}">${I(it.icon || 'shield', 26)}</div><div class="cb"><h4>${it.name}${cls}</h4><p>${it.special || it.desc}</p>${own ? '<small>Crafted</small>' : `${locked ? `<div class="lockbar">${I('lock', 15)}<span>Locked</span></div>` : `<div class="recipe">${recipeChips(g, it)}</div>`}`}</div><div class="ca">${act}</div></div>`;
    };
    const weapons = RL.Data.classOrder.map((cid) => Object.values(RL.Data.weapons).filter((w) => w.craft && w.class === cid).map((w) => item('weapons', w)).join('')).join('');
    const armors = Object.values(RL.Data.armors).filter((a) => a.craft).map((a) => item('armors', a)).join('');
    return `<div class="panel">${H.head(g, 'Forge')}<div class="scroll"><p class="note">Every cleared room has a ${Math.round(RL.Data.materialChance * 100)}% chance to drop one material. The first weapon of a class takes four, everything else five, so expect roughly ${Math.round(4 / RL.Data.materialChance)}–${Math.round(5 / RL.Data.materialChance)} cleared rooms per item. A class's second weapon unlocks only after you craft its first. The Iron Sword is yours from the start. Emberstone drops cinderite and obsidian.</p>
      <div class="mats">${mats}</div><section><h3 class="sec">Weapons</h3><div class="cards">${weapons}</div></section><section><h3 class="sec">Armor</h3><div class="cards">${armors}</div></section></div></div>`;
  };

  /* ---------- Permanent upgrades ---------- */
  S.upgrades = (g) => {
    const cards = Object.values(RL.Data.metaUpgrades).map((u) => {
      const l = g.progression.upgradeLevel(u.id), cost = g.progression.upgradeCost(u.id);
      return `<div class="card"><div class="ci" style="--c:#e3b860">${I('up', 26)}</div><div class="cb"><h4>${u.name}</h4><p>${u.desc}</p><div class="pips">${Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('')}</div></div>
        <div class="ca">${cost === null ? '<span class="tag">Max</span>' : H.costBtn(g, cost, `data-act="metaBuy" data-id="${u.id}"`)}</div></div>`;
    }).join('');
    return `<div class="panel">${H.head(g, 'Upgrades')}<div class="scroll"><p class="note">Permanent bonuses, kept between runs. Earn Aurels by collecting coins and clearing rooms.</p><div class="cards">${cards}</div></div></div>`;
  };

  /* ---------- Regions ---------- */
  S.regions = (g) => {
    const d = g.save.data;
    const cards = Object.values(RL.Data.regions).sort((a, b) => a.order - b.order).map((r) => {
      const open = g.save.has('regions', r.id), sel = d.selected.region === r.id;
      let action = '<span class="tag dim">Locked</span>';
      if (open && r.implemented) action = sel ? '<span class="tag">Selected</span>' : `<button class="btn" data-act="region" data-id="${r.id}">Select</button>`;
      else if (open) action = '<span class="tag dim">Not yet charted</span>';
      return `<div class="card tall ${sel ? 'sel' : ''} ${open ? '' : 'locked'}"><div class="ci" style="--c:${r.implemented ? '#' + r.theme.accent.toString(16).padStart(6, '0') : '#6b7d76'}">${I(open ? 'door' : 'lock', 26)}</div><div class="cb"><h4>${r.name}</h4><p>${r.blurb}</p><small>${r.hazards ? 'Hazards: ' + r.hazards.join(', ') : ''}</small></div><div class="ca">${action}</div></div>`;
    }).join('');
    return `<div class="panel">${H.head(g, 'Regions')}<div class="scroll"><p class="note">Defeat the boss of a region to unlock the next. All five regions are playable and each is harder than the last. Starting deeper grants free upgrades up front (3 in Emberstone, 5 in the Marsh, 7 in the Sunken Ruins, 8 in Frostveil).</p><div class="cards">${cards}</div></div></div>`;
  };


  /* ---------- Save slots ---------- */
  const when = (t) => { try { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  S.intro = (g, a) => a.phase === 'title'
    ? `<div class="intro-title" data-act="introGo"><h1 class="title">Warden<span>fall</span></h1><p class="intro-sub">Take up the sword. Climb the peak.</p><p class="intro-go">Click to begin</p></div>`
    : `<div class="intro-play" data-act="introSkip"><i class="bar top"></i><i class="bar bot"></i><div class="intro-cap ${a.last ? 'big' : ''}" key="${H.esc(a.caption)}"><h2>${H.esc(a.caption)}</h2><p>${H.esc(a.sub || '')}</p></div><em class="intro-skip">Click to skip</em></div>`;
  S.loading = (g, a) => `<div class="loadscr"><div class="lq"><p class="eyebrow">Entering</p><h2>${H.esc(a.region.name)}</h2><blockquote>&ldquo;${H.esc(a.quote[0])}&rdquo;<cite>${H.esc(a.quote[1])}</cite></blockquote><div class="lbar"><u></u></div></div></div>`;
  S.credits = () => `<div class="credits" data-act="creditsSkip"><div class="roll">
    <h1 class="title">Warden<span>fall</span></h1>
    <p class="cl">A game by</p><h2>Austin May</h2><p class="cl">Developer</p>
    <p class="cs">Thank you for playing.</p>
    <p class="cf">Special thanks to</p>
    <p>The Spirit Wolf, who did all the actual work</p>
    <p>Every goblin who parried you first and never let you forget it</p>
    <p>The yetis, who only wanted to play catch (with icebergs)</p>
    <p>The Cinderplate, for being the only thing between you and frostbite</p>
    <p>The dodge button, which was pressed approximately 40,000 times</p>
    <p>Your thumbs. Please stretch them.</p>
    <p class="cf">Frequently asked questions</p>
    <p>Was the Winter King really that cold? Yes.</p>
    <p>Did anything get damaged in the making of this game? Only the goblins' feelings.</p>
    <p>Is there a sequel? The wolf says maybe.</p>
    <p class="cs">Now go touch some grass. Real grass. It isn't thorny.</p>
    <h3 class="king">Jesus is King</h3></div><em class="intro-skip">Click to skip</em></div>`;
  /* ---------- Online co-op ---------- */
  S.online = (g, a) => `<div class="panel narrow">${H.head(g, 'Online Play')}<div class="scroll">
    <p class="note">Play a run together with a friend, each on your own phone. One of you creates a game and shares the 4-letter code.</p>
    ${a && a.error ? `<p class="err">${H.esc(a.error)}</p>` : ''}
    <button class="btn primary big wide" data-act="onlineCreate">${I('play', 18)}<span>Create Game</span></button>
    <form class="joinform" data-submit="onlineJoin"><label class="field"><span>Have a code? Join a friend's game</span>
      <input id="join-code" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="CODE" data-focus="${a && a.error ? 1 : 0}"></label>
      <button class="btn big wide" type="submit">${I('door', 18)}<span>Join Game</span></button></form></div></div>`;
  S.lobby = (g) => {
    const o = g.online, host = o.role === 'host', me = o.players.find((p) => p.id === o.id), reg = RL.Data.regions[o.region] || {};
    const rows = o.players.map((p) => `<div class="lobbyrow ${p.ready ? 'ready' : ''}"><i style="background:#${(p.armor || 0).toString(16).padStart(6, '0')}"></i><span>${H.esc(p.name)}${p.id === 0 ? ' <em>host</em>' : ''}${p.id === o.id ? ' <em>you</em>' : ''}</span><b>${p.ready ? 'Ready' : 'Waiting'}</b></div>`).join('');
    return `<div class="panel narrow"><header class="sh"><button class="btn ghost" data-act="onlineLeave">${I('back', 16)}<span>Leave</span></button><h2>Game Lobby</h2><span></span></header><div class="scroll">
      <p class="eyebrow">${host ? 'Tell your friend this code' : 'Joined game'}</p><div class="gamecode">${H.esc(o.code)}</div>
      <div class="lobbylist">${rows || '<p class="note">Connecting…</p>'}</div>
      <p class="note">Region: <b>${H.esc(reg.name || '')}</b>${host ? ` <button class="btn ghost" data-act="onlineRegion">Change</button>` : ''}</p>
      <p class="note">${o.players.length < 2 ? 'Waiting for a friend to join…' : 'The run starts when everyone is ready.'}</p>
      <button class="btn primary big wide" data-act="onlineReady" ${o.players.length < 2 && host ? 'disabled' : ''}>${I('shield', 18)}<span>${me && me.ready ? 'Not ready' : 'Ready'}</span></button></div></div>`;
  };
  S.onlineOver = (g, a) => `<div class="panel small center"><h2>${a.win ? 'Victory!' : 'The run has ended'}</h2><p class="note">${H.esc(a.text || (a.win ? 'Your team cleared the region.' : 'Your team has fallen.'))}</p><button class="btn primary big wide" data-act="onlineLeave"><span>Back to menu</span></button></div>`;
  S.slots = (g, a) => {
    const metas = RL.SaveSystem.list(), canBack = g.save.slot !== null;
    const cards = metas.map((m, i) => {
      const cur = g.save.slot === i;
      if (a.mode === 'new' && a.slot === i) return `<form class="slot open" data-submit="slotCreate" data-slot="${i}"><div class="sn">Slot ${i + 1}</div>
        <label class="field"><span>Adventurer name</span><input id="slot-name" type="text" maxlength="16" autocomplete="off" placeholder="Your name" data-focus="1"></label>
        <label class="field"><span>Password <em>(optional, locks this slot)</em></span><input id="slot-pw" type="password" autocomplete="new-password" placeholder="Leave blank for no lock"></label>
        ${a.error ? `<p class="err">${a.error}</p>` : ''}<div class="srow"><button class="btn primary" type="submit">Create</button><button class="btn ghost" type="button" data-act="slotCancel">Cancel</button></div></form>`;
      if (a.mode === 'unlock' && a.slot === i && m) return `<form class="slot open" data-submit="slotUnlock" data-slot="${i}"><div class="sn">Slot ${i + 1} · ${H.esc(m.name)}</div>
        <label class="field"><span>Password</span><input id="slot-pw" type="password" autocomplete="current-password" placeholder="Enter password" data-focus="1"></label>
        ${a.error ? `<p class="err">${a.error}</p>` : ''}<div class="srow"><button class="btn primary" type="submit">${I('lock', 16)}<span>Unlock</span></button><button class="btn ghost" type="button" data-act="slotCancel">Cancel</button></div></form>`;
      if (!m) return `<div class="slot empty"><div class="sn">Slot ${i + 1}</div><p class="note">Empty</p><button class="btn" data-act="slotNew" data-slot="${i}">New adventurer</button></div>`;
      if (a.confirmDelete === i) return `<div class="slot open"><div class="sn">Slot ${i + 1} · ${H.esc(m.name)}</div><p class="err">Erase this adventurer and all of their progress?</p><div class="srow"><button class="btn warn" data-act="slotDelConfirm" data-slot="${i}">Erase forever</button><button class="btn ghost" data-act="slotCancel">Keep</button></div></div>`;
      const sum = m.summary || {};
      const detail = m.hash ? `<p class="note">Locked · last played ${when(m.updated)}</p>`
        : `<p class="note">${sum.runs || 0} runs · ${sum.wins || 0} victories · best ${sum.bestRooms || 0} rooms · ${sum.currency || 0} Aurels</p>`;
      return `<div class="slot ${cur ? 'cur' : ''}"><div class="sn">Slot ${i + 1}${cur ? ' · in use' : ''}</div><h4>${m.hash ? I('lock', 16) : ''} ${H.esc(m.name)}</h4>${detail}
        <div class="srow"><button class="btn primary" data-act="slotPlay" data-slot="${i}">${I('play', 16)}<span>${cur ? 'Continue' : 'Play'}</span></button><button class="btn ghost" data-act="slotDelAsk" data-slot="${i}" aria-label="Erase slot ${i + 1}">${I('skull', 16)}</button></div></div>`;
    }).join('');
    return `<div class="panel"><header class="sh">${canBack ? `<button class="btn ghost" data-act="go" data-screen="menu">${I('back', 16)}<span>Back</span></button>` : '<span></span>'}<h2>Save Slots</h2><span></span></header>
      <div class="scroll"><p class="note">Each slot keeps its own progress. Add a password to lock a slot. Slots live in this browser.</p><div class="slots">${cards}</div><button class="btn" data-act="go" data-screen="backup">${I('key', 16)}<span>Backup &amp; restore</span></button></div></div>`;
  };
  S.password = (g, a) => `<div class="panel small"><p class="eyebrow">${H.esc(g.save.meta.name)} · Slot ${g.save.slot + 1}</p><h2>Slot password</h2>
    <p class="story">${g.save.meta.hash ? 'Enter a new password, or leave it blank to remove the lock.' : 'Choose a password to lock this slot. You will need it each time you open the slot.'}</p>
    <form class="stack" data-submit="pwSave"><label class="field"><span>New password</span><input id="slot-pw" type="password" autocomplete="new-password" placeholder="${g.save.meta.hash ? 'Blank removes the lock' : 'Password'}" data-focus="1"></label>
    ${a.error ? `<p class="err">${a.error}</p>` : ''}<button class="btn primary wide" type="submit">Save</button><button class="btn ghost wide" type="button" data-act="back" data-screen="settings">Back</button></form></div>`;

  /* ---------- Settings ---------- */
  S.settings = (g, a) => {
    const s = g.save.data.settings, tog = (k, label) => `<label class="row"><span>${label}</span><button class="switch ${s[k] ? 'on' : ''}" data-act="toggle" data-key="${k}" aria-pressed="${!!s[k]}"><i></i></button></label>`;
    return `<div class="panel narrow">${H.head(g, 'Settings', a.fromPause ? 'pause' : 'menu')}<div class="scroll">
      <label class="row" for="set-volume"><span>Sound effects</span><input id="set-volume" type="range" min="0" max="1" step="0.05" value="${s.volume}" data-set="volume"></label>
      <label class="row" for="set-music"><span>Music</span><input id="set-music" type="range" min="0" max="1" step="0.05" value="${s.music}" data-set="music"></label>
      ${tog('shake', 'Screen shake')}${tog('numbers', 'Damage numbers')}${tog('shadows', 'Shadows')}
      <div class="row"><span>${I(g.save.meta && g.save.meta.hash ? 'lock' : 'shield', 18)} Slot password <small class="mute">${g.save.meta && g.save.meta.hash ? 'Locked' : 'Not set'}</small></span><button class="btn" data-act="go" data-screen="password">${g.save.meta && g.save.meta.hash ? 'Change…' : 'Add…'}</button></div>
      <div class="row"><span>${I('key', 18)} Backup &amp; restore <small class="mute">Export or import a save code</small></span><button class="btn" data-act="go" data-screen="backup">Open</button></div>
      <div class="row danger"><span>Erase this slot's progress</span>${a.confirm ? `<button class="btn warn" data-act="resetConfirm">Erase everything</button>` : `<button class="btn" data-act="resetAsk">Erase…</button>`}</div></div></div>`;
  };

  /* ---------- In run ---------- */
  S.pause = (g, a) => `<div class="panel small center"><h2>Paused</h2><div class="stack">
      <button class="btn primary big" data-act="resume">${I('play', 18)}<span>Resume</span></button>
      <button class="btn" data-act="pauseSettings">${I('gear', 18)}<span>Settings</span></button>
      ${a.confirm ? `<button class="btn warn" data-act="abandonConfirm">End run and collect Aurels</button>` : `<button class="btn" data-act="abandonAsk">Abandon run</button>`}</div></div>`;

  S.levelUp = (g, a) => `<div class="levelup"><p class="eyebrow">${a.source === 'level' ? 'Level ' + g.levels.level : a.source === 'altar' ? 'The altar answers' : a.source === 'well' ? 'The well answers' : 'Boon'}</p><h2>Choose an upgrade</h2>
    <div class="choices">${a.choices.map((c, i) => { const d = g.upgrades.describe(c); return `<button class="choice r-${d.rarity}" data-act="pick" data-i="${i}" data-guard="1"><span class="key">${i + 1}</span><span class="cico">${I(d.icon, 34)}</span><b>${d.name}</b><span class="rar">${d.tag}${d.stack ? ' · ' + d.stack : ''}</span><p>${d.desc}</p></button>`; }).join('')}</div></div>`;

  S.event = (g, a) => `<div class="panel small"><p class="eyebrow">Wayside shrine</p><h2>${a.event.title}</h2><p class="story">${a.event.text}</p>${a.result
    ? `<p class="result">${a.result}</p><button class="btn primary wide" data-act="eventDone">Continue</button>`
    : `<div class="stack">${a.event.options.map((o, i) => `<button class="btn opt" data-act="eventOpt" data-i="${i}" ${o.need && g.run.gold < o.need ? 'disabled' : ''}><b>${o.label}</b><small>${o.desc}</small></button>`).join('')}</div>`}</div>`;

  S.shop = (g, a) => `<div class="panel small"><p class="eyebrow">Wandering trader</p><h2>Wares</h2><p class="story">"Coin for comfort, friend. The road is long."</p><div class="aurel inline">${I('coin', 18)}<b>${g.run.gold}</b><small>Aurels this run</small></div>
    <div class="stack">${a.stock.map((s, i) => `<button class="btn opt" data-act="shopBuy" data-i="${i}" ${s.sold || g.run.gold < s.cost ? 'disabled' : ''}><span class="oi">${I(s.icon, 22)}</span><span class="ot"><b>${s.name}</b><small>${s.desc}</small></span><span class="oc">${s.sold ? 'Sold' : I('coin', 15) + ' ' + s.cost}</span></button>`).join('')}</div>
    <button class="btn wide" data-act="shopLeave">Leave</button></div>`;

  const summary = (g, r, win) => `<div class="panel small center ${win ? 'win' : ''}"><p class="eyebrow">${win ? r.regionName : 'Run ended'}</p>
    <h2 class="big-title">${win ? r.bossName + ' Falls' : 'Fallen on the Road'}</h2>
    <p class="story">${win ? ((r.story || {}).win || '') : ((r.story || {}).lose || 'Your Aurels come home with you.')}</p>
    <div class="stats three"><div class="stat"><span>Rooms</span><b>${r.rooms}</b></div><div class="stat"><span>Foes</span><b>${r.kills}</b></div><div class="stat"><span>Level</span><b>${r.level}</b></div><div class="stat"><span>Time</span><b>${H.time(r.time)}</b></div></div>
    <div class="ledger"><div><span>Coins collected</span><b>${r.gold}</b></div><div><span>Rooms cleared</span><b>${r.roomPay}</b></div><div><span>Foes defeated</span><b>${r.killPay}</b></div>${Object.keys(r.mats || {}).length ? `<div><span>Materials found</span><b>${Object.keys(r.mats).map((m) => RL.Data.materials[m].name + ' ×' + r.mats[m]).join(', ')}</b></div>` : ''}${r.bonus ? `<div><span>Region bonus</span><b>${r.bonus}</b></div>` : ''}<div class="total"><span>Earned</span><b>${I('coin', 18)} ${r.award}</b></div></div>
    ${r.unlockedRegion ? `<p class="unlock">${I('lock', 16)} New region unlocked: ${RL.Data.regions[r.unlockedRegion].name}</p>` : ''}
    <div class="stack"><button class="btn primary big" data-act="go" data-screen="startRun">${I('play', 18)}<span>Another run</span></button><button class="btn" data-act="go" data-screen="upgrades">${I('star', 18)}<span>Spend Aurels</span></button><button class="btn ghost" data-act="go" data-screen="menu">Main menu</button></div></div>`;
  S.gameOver = (g, a) => summary(g, a.result, false);
  S.victory = (g, a) => summary(g, a.result, true);
  S.regionClear = (g, a) => `<div class="panel small center win"><p class="eyebrow">${RL.Data.regions[g.run.regionId].name}</p>
    <h2 class="big-title">${g.boss ? g.boss.def.name : 'The guardian'} has fallen</h2>
    <p class="story">${RL.Data.regions[g.run.regionId].story.win}</p>
    ${a.next ? `<div class="hero-region"><p class="eyebrow">Beyond the gate</p><h3>${a.next.name}</h3><p>${a.next.blurb}</p><small>Hazards: ${a.next.hazards.join(', ')}</small></div>` : ''}
    <p class="note">Press on and you keep every upgrade, recover half your health and carry your coins forward. Claim victory and you bank the run now.</p>
    <div class="stack"><button class="btn primary big" data-act="pressOn">${I('door', 18)}<span>Press on to ${a.next ? a.next.name : 'the next region'}</span></button><button class="btn" data-act="claim">${I('coin', 18)}<span>Claim victory &amp; return</span></button></div></div>`;

  /* ---------- Actions ---------- */
  A.go = (g, ui, d) => { if (ui.screen && ui.screen !== d.screen) (ui.hist = ui.hist || []).push({ name: ui.screen, args: ui.args }); ui.show(d.screen); };
  A.back = (g, ui, d) => { const prev = (ui.hist || []).pop(); if (prev && RL.UI.screens[prev.name]) ui.show(prev.name, prev.args); else ui.show(d.screen || 'menu'); };
  A.creditsSkip = (g) => g.endCredits();
  A.craft = (g, ui, d) => { if (g.progression.craft(d.kind, d.id)) { g.audio.play('level'); } ui.refresh(); };
  A.shield = () => {};
  A.pressOn = (g) => g.advanceRegion();
  A.claim = (g) => { g.ui.hide(); g.endRun(true); };

    const a = this.time * 0.12, cam = this.render.camera, m = this.player.model, p = this.player;
    if (this.rooms.env) this.rooms.env.update(dt, p.x, p.z);
    if (m && this.state === 'menu') { m.group.position.set(0, 0, 0); m.group.visible = false; } // no hero on the Home Screen
    const cx = this.state === 'menu' ? 0 : p.x, cz = this.state === 'menu' ? 0 : p.z;
    { cam.position.set(cx + Math.sin(a) * 9.5, 4.6, cz + Math.cos(a) * 9.5); cam.lookAt(cx, 1.7, cz); }
  }
  stepTransition(dt) {
    const t = this.trans; t.t += dt;
    if (t.phase === 0) { this.ui.setFade(Math.min(1, t.t / 0.3)); if (t.t >= 0.3) { this.rooms.enter(t.node); t.phase = 1; t.t = 0; } }
    else { this.ui.setFade(Math.max(0, 1 - t.t / 0.35)); if (t.t >= 0.35) { this.trans = null; this.ui.setFade(0); this.setState('playing'); } }
  }
  step(dt) {
    const g = this;
    if (g.state === 'playing') {
      for (const i of g.input.consumeAbilities()) g.abilities.cast(i, true);
      if (g.input.consumePause()) { g.pause(); return; }
    }
    g.run.time += dt;
    g.player.update(dt); for (const pt of g.partners) pt.update(dt); g.weapons.update(dt); g.abilities.update(dt); g.allies.update(dt); g.enemies.update(dt); g.projectiles.update(dt);
    g.tele.update(dt); g.loot.update(dt); g.hazards.update(dt); g.rooms.update(dt); g.fx.update(dt); g.emberAura(dt);
    g.render.follow(g.player.x, g.player.z, dt);
    if (g.state === 'playing') {
      g.processPicks();
      if (g.victoryT > 0 && g.state === 'playing') { g.victoryT -= dt; if (g.victoryT <= 0) { if (g.nextRegion()) g.openRegionClear(); else g.endRun(true); } }
    } else if (g.state === 'dying') { g.deathT -= dt; if (g.deathT <= 0) g.endRun(false); }
  }
};

RL.boot = function () {
  const canvas = document.getElementById('game'), root = document.getElementById('ui'), boot = document.getElementById('boot');
  try {
    if (typeof THREE === 'undefined') throw new Error('The 3D engine could not be loaded. Check your connection and reload.');
    const game = (window.game = new RL.Game(canvas, root)); game.start(); if (boot) boot.hidden = true;
  } catch (err) {
    if (boot) { boot.hidden = false; boot.querySelector('p').textContent = err && err.message ? err.message : String(err); }
    if (window.console) console.error(err);
  }
};

}
</script>
<script>RL.boot();</script>
